name: Security scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historia completa para escanear todos los commits

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Audit npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Vulnerabilidades (runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Vulnerabilidades (tooling de build)
        continue-on-error: true
        run: npm audit --audit-level=high
